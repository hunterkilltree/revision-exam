name: docker-publish

# Manual only: Actions tab -> docker-publish -> Run workflow.
# Builds the selected image(s) (both / backend / frontend) and pushes them as :latest (plus a :<short-sha> tag) to Docker Hub.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build and push"
        required: true
        default: both
        type: choice
        options:
          - both
          - backend
          - frontend
      api_url:
        description: "Backend URL baked into the frontend (NEXT_PUBLIC_API_URL). Defaults to repo variable NEXT_PUBLIC_API_URL."
        required: false
        type: string

jobs:
  backend:
    if: inputs.target == 'both' || inputs.target == 'backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            testfeaturedev/revision-exam-be:latest
            testfeaturedev/revision-exam-be:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    if: inputs.target == 'both' || inputs.target == 'frontend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.api_url || vars.NEXT_PUBLIC_API_URL }}
          tags: |
            testfeaturedev/revision-exam:latest
            testfeaturedev/revision-exam:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
